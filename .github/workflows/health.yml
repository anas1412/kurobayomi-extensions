name: Source health

# Checks that each source's site answers and writes the result into the index, so the app shows a green, orange or red dot
# next to each source. See tools/check-health.py for the rules.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Test the rules
        run: python3 tools/test-check-health.py

      - name: Check the sites
        run: python3 tools/check-health.py

      - name: Rebuild the index
        run: python3 tools/make-index.py

      - name: Commit a change
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.toml health-state.json index.min.json
          git commit -m "Update source health"
          git push
