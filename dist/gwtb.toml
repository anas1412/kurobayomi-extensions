# Gone with the Blastwave, ported from keiyoushi/extensions-source (src/en/gwtb), Apache-2.0. See README.md.
id = "gwtb"
name = "Gone with the Blastwave"
lang = "en"
kind = "manga"
base_urls = ["https://www.blastwave-comic.com"]
rate_limit_ms = 1000

[urls]
# The site is one comic, so Browse shows one entry. The extension had it built in; a recipe reads it from the home page.
popular = "/index.php"

[popular]
items = "html"
title = { select = "title", regex = "^(.+?) - " }
url = { select = "#menu a", attr = "href" }

[details]
title = { select = "title", regex = "^(.+?) - " }
author = { select = "div.copyright", regex = "\\d{4} ([A-Za-z][^-]*?) - Hosted" }
artist = { select = "div.copyright", regex = "\\d{4} ([A-Za-z][^-]*?) - Hosted" }
description = { select = "title", regex = " - (.+)$" }

# The strips are the options of the "Jump to a strip" list, newest first. The first option is the prompt.
# The strip address is /index.php?nro=<value>; `format` builds it from the option value.
[chapters]
items = "select.fall > option:not(:first-child)"
name = {}
url = { attr = "value", format = "/index.php?nro={}" }
number = { attr = "value" }

[pages]
items = ".comic_title + img"
image = { attr = "src" }

[tests]
item_url = "^/index\\.php\\?nro=\\d+$"
popular = "index.html"
details = "index.html"
chapters = "index.html"
pages = "chapter.html"
