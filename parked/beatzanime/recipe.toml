# BeatZ Anime (Spanish fansub site). Ported from yuzono/anime-extensions, src/es/beatzanime (Apache-2.0).
# Status: popular, latest, details and the episode list work. Search and playback do NOT (they need engine changes, see README.md and NEEDS-ENGINE.md).
id = "beatzanime"
name = "BeatZ Anime"
lang = "es"
kind = "anime"
base_urls = ["https://www.beatz-anime.net"]
rate_limit_ms = 1000

# The Kotlin sends a Referer with the video file. (Its video Accept header and Host header are left out: headers here
# go with every page request too, and Host is not allowed.)
[headers]
Referer = "https://www.beatz-anime.net/"

[urls]
popular = "/"
latest = "/index.php?pagina={page}"
# No `search`: the site's /lista-animes/ page ignores the query and filters in JavaScript (NEEDS-ENGINE.md).

# The "top 7 most viewed" strip on the home page. The site repeats the 7 cards a second time for its scrolling
# animation; the Kotlin removes the copies, here only the first 7 children are taken.
[popular]
items = "article.top-views-card:nth-child(-n+7)"
title = { select = "h3.top-views-title" }
url = { select = "a.top-views-poster", attr = "href" }
cover = { select = "img", attr = "src" }

# Recent uploads on the home page. The card image is a 16:9 still (the Kotlin builds the portrait poster address from
# the slug, which a recipe cannot do).
[latest]
items = ".row > div:has(a.titulo-largo)"
title = { select = "a.titulo-largo" }
url = { select = "a.titulo-largo", attr = "href" }
cover = { select = "img", attr = "src" }
next_page = "ul.pagination > li.active + li:not(.disabled)"

[details]
title = { select = "h1" }
cover = { select = "div.poster-card img", attr = "src" }
# The plot is the text of the paragraph before its "Generos:" span (the Kotlin also appends the synonyms).
description = { select = "p.post-text", regex = "(?s)^(.*?)(?:\\s*Generos:|$)" }
genre = { select = "p.post-text span", all = true, regex = "Generos:\\s*(.+)" }
status = { select = "div.stat-item a[href*='estado=']" }

[details.status_map]
ongoing = ["en emisi", "en ems"]
completed = ["finalizado"]

# One row per file in the collapsed "Lista de Archivos" table: name, format, type, size, download link.
# The Kotlin skips non-video rows (checksums) and orders specials after the regular episodes; here the rows are
# taken as the site lists them, reversed so the newest is first.
[episodes]
items = "#collapseExampled tbody tr:has(a.btn-descarga-premium)"
name = { select = "td", nth = 0 }
url = { select = "a.btn-descarga-premium", attr = "href" }
number = { select = "td", nth = 0, regex = "(\\d+)\\s*$" }
scanlator = { select = "td", nth = 3 }
reverse = true

# The episode url is already the video file (on bz.beatz-anime.net), so there is no page to read. The recipe format
# cannot say that yet (NEEDS-ENGINE.md); this block only satisfies the format and finds nothing.
[videos]
items = "video source"
url = { attr = "src" }

[tests]
popular = "home.html"
latest = "home.html"
details = "jujutsu.html"
episodes = "jujutsu.html"
