[package]
name = "kurobayomi-source-comix"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: not part of any workspace, so it builds on its own.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.41"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
