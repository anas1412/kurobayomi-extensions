id = "comix"
name = "Comix"
lang = "en"
kind = "manga"
version = 2

# The host allow-list: the plug-in's `http` calls reach only these hosts (an entry `*.x` matches subdomains of x).
hosts = ["comix.to", "*.comix.to", "comix.ws", "*.comix.ws"]

# Fields the app's .kuroext manifest.json needs; tools/package.py reads them. `pkg` is a placeholder the lead may change.
pkg = "eu.kurobayomi.comix"
version_name = "1.5.0"   # x.y must equal abi
version_code = 2
abi = "1.5"
base_url = "https://comix.to"
