[package]
name = "kuro-source-kickassanime"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: not part of any workspace, so it builds on its own.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wit-bindgen = "0.57"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
