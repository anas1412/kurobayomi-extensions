[package]
name = "kuro-weebcentral"
version = "0.1.0"
edition = "2024"
publish = false

# A standalone crate: not part of any workspace, so it builds on its own.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
wit-bindgen = "0.57.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
